<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | MyFolio 3D Portfolio Studio</title>
  <meta name="description" content="The requested page could not be located in this universe. Return to MyFolio 3D Studio or explore your developer dashboard." />
  
  <!-- Open Graph / Social Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="404 — Page Not Found | MyFolio" />
  <meta property="og:description" content="The requested page coordinates do not exist. Return to MyFolio 3D Portfolio Studio." />
  <meta property="og:image" content="/assets/3d/cosmic_astronaut_3d.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #05080A;
      --card-bg: rgba(13, 19, 28, 0.75);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #38BDF8;
      --accent: #A855F7;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 24px;
    }

    /* Ambient Glow Background */
    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(168, 85, 247, 0.08) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(60px);
    }

    .error-container {
      position: relative;
      z-index: 1;
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(56, 189, 248, 0.1);
    }

    .glitch-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 15vw, 8.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
      background: linear-gradient(135deg, #38BDF8 0%, #A855F7 50%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      display: inline-block;
      position: relative;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
      padding: 6px 14px;
      border-radius: 100px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .error-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: 14px;
      color: #FFFFFF;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38BDF8 0%, #0284C7 100%);
      color: #05080A;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(56, 189, 248, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .footer-brand {
      margin-top: 32px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-brand a {
      color: var(--primary);
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .error-container {
        padding: 36px 20px;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="error-container">
    <div class="status-badge">
      <i data-lucide="alert-triangle" style="width:14px;height:14px;"></i>
      <span>HTTP 404 • COSMIC DISCONNECT</span>
    </div>

    <div>
      <h1 class="glitch-code">404</h1>
    </div>

    <h2 class="error-title">Dimensional Coordinates Not Found</h2>
    <p class="error-desc">
      The portfolio, page, or universe you are trying to reach has either been relocated, expired, or exists in an alternate timeline.
    </p>

    <div class="button-group">
      <a href="/studio.html" class="btn btn-primary">
        <i data-lucide="sparkles" style="width:18px;height:18px;"></i>
        <span>Launch 3D Studio</span>
      </a>
      <a href="/dashboard.html" class="btn btn-secondary">
        <i data-lucide="layout-dashboard" style="width:18px;height:18px;"></i>
        <span>My Dashboard</span>
      </a>
      <a href="/" class="btn btn-secondary">
        <i data-lucide="home" style="width:18px;height:18px;"></i>
        <span>Homepage</span>
      </a>
    </div>

    <div class="footer-brand">
      Powered by <a href="/">MyFolio AI Portfolio Generator</a>
    </div>
  </div>

  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>
</body>
</html>
