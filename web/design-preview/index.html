<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MyFolio — Cohesive Multi-Page Visual System</title>
  <meta name="description" content="Different Worlds, One Brand. Isolated localhost prototype environment for MyFolio platform pages.">

  <!-- Google Fonts: Anton (Masthead), Condiment (Accent), Inter (Body) & JetBrains Mono (Telemetry) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Condiment&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgNavy: '#010828',
            bgCharcoal: '#0C0E17',
            bgEngine: '#070B19',
            bgGallery: '#080B18',
            bgControl: '#0B0F1E',
            bgIdentity: '#120F19',
            bgWorkstation: '#080B14',
            bgArchive: '#F8F7F3',
            bgManifesto: '#F5F4EE',
            cream: '#EFF4FF',
            creamDark: '#010828',
            neon: '#6FFF00',
            amberAccent: '#F59E0B',
            blueTech: '#38BDF8',
          },
          fontFamily: {
            grotesk: ['Anton', 'sans-serif'],
            condiment: ['Condiment', 'cursive'],
            body: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-navy: #010828;
      --cream: #EFF4FF;
      --neon: #6FFF00;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Reserved Liquid Glass Effect (Strictly for floating nav, modals, singular portals) */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12);
      position: relative;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 20%,
        rgba(255,255,255,0) 50%, rgba(255,255,255,0.1) 80%,
        rgba(255,255,255,0.3) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Environmental Textures */
    .env-blueprint {
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .env-scanlines {
      background-image: repeating-linear-gradient(
        0deg,
        rgba(56, 189, 248, 0.015) 0px,
        rgba(56, 189, 248, 0.015) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    .env-grid-subtle {
      background-image: 
        radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .env-paper {
      background-image: radial-gradient(rgba(1, 8, 40, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    /* =========================================================================
       ARCHITECTURAL LIGHT THEME (Museum Ivory Canvas & Pure Alabaster Surfaces)
       ========================================================================= */
    /* 1. Global Background Canvas */
    .theme-light,
    .theme-light body,
    .theme-light main,
    .theme-light #collection {
      background-color: #F6F5F0 !important;
      color: #010828 !important;
    }

    /* Keep the outer page layout wrappers ivory so white cards pop on top */
    .theme-light .min-h-screen:not(.bg-white) {
      background-color: #F6F5F0 !important;
    }

    /* 2. Top Review Command Bar & Nav Header */
    .theme-light header.sticky {
      background-color: rgba(255, 255, 255, 0.94) !important;
      border-bottom: 1px solid rgba(1, 8, 40, 0.10) !important;
      color: #010828 !important;
      box-shadow: 0 4px 20px -2px rgba(1, 8, 40, 0.05) !important;
    }
    .theme-light header.sticky a,
    .theme-light header.sticky span:not(.bg-neon),
    .theme-light header.sticky button {
      color: #010828 !important;
    }
    .theme-light header.sticky .border-white\/10 {
      border-color: rgba(1, 8, 40, 0.10) !important;
    }
    .theme-light header.sticky a.text-cream\/70,
    .theme-light header.sticky button.text-cream\/70 {
      color: rgba(1, 8, 40, 0.65) !important;
    }
    .theme-light header.sticky a.text-cream\/70:hover,
    .theme-light header.sticky button.text-cream\/70:hover {
      background-color: rgba(1, 8, 40, 0.06) !important;
      color: #010828 !important;
    }

    /* 3. Universal Cards, Panels, Slabs & Containers */
    /* Every card class used across Jack 3D, Studio, Generator, Dashboard, Profile, Auth, etc. */
    .theme-light .rounded-3xl:not(#hero):not(#contact):not(#how-it-works),
    .theme-light .rounded-2xl:not(#hero):not(#contact):not(#how-it-works),
    .theme-light [class*="rounded-[32px]"]:not(#hero):not(#contact):not(#how-it-works),
    .theme-light [class*="rounded-[28px]"]:not(#hero):not(#contact):not(#how-it-works),
    .theme-light [class*="rounded-[24px]"]:not(#hero):not(#contact):not(#how-it-works),
    .theme-light [class*="rounded-[20px]"]:not(#hero):not(#contact):not(#how-it-works),
    .theme-light [class*="bg-[#141724]"],
    .theme-light [class*="bg-[#141416]"],
    .theme-light [class*="bg-[#0D152A]"],
    .theme-light [class*="bg-[#121626]"],
    .theme-light [class*="bg-[#080E24]"],
    .theme-light [class*="bg-[#12172F]"],
    .theme-light [class*="bg-[#1B1626]"],
    .theme-light [class*="bg-[#0E1322]"],
    .theme-light [class*="bg-[#0B0F1B]"],
    .theme-light [class*="bg-[#080B14]"],
    .theme-light [class*="bg-[#070b19]"],
    .theme-light [class*="bg-[#0e162e]"],
    .theme-light [class*="bg-[#0b1124]"],
    .theme-light [class*="bg-[#050b18]"],
    .theme-light [class*="bg-[#111a36]"],
    .theme-light [class*="bg-[#0c142b]"],
    .theme-light [class*="bg-[#101935]"],
    .theme-light [class*="bg-[#080e22]"],
    .theme-light [class*="bg-[#0a1024]"],
    .theme-light [class*="bg-[#070d20]"],
    .theme-light [class*="bg-[#0e1736]"],
    .theme-light [class*="bg-[#09112a]"],
    .theme-light [class*="bg-[#0d132b]"],
    .theme-light [class*="bg-[#121a3a]"],
    .theme-light [class*="bg-[#152048]"],
    .theme-light [class*="bg-[#131120]"],
    .theme-light [class*="bg-[#1a172c]"],
    .theme-light [class*="bg-[#1f1b34]"],
    .theme-light [class*="bg-[#0d1424]"],
    .theme-light [class*="bg-[#141d33]"],
    .theme-light [class*="bg-[#0a0f1d]"],
    .theme-light [class*="bg-[#030612]"] {
      background-color: #FFFFFF !important;
      border-color: rgba(1, 8, 40, 0.09) !important;
      box-shadow: 0 4px 20px -2px rgba(1, 8, 40, 0.05), 0 1px 3px rgba(1, 8, 40, 0.03) !important;
      color: #010828 !important;
    }

    /* 4. Frosted Alabaster Glass */
    .theme-light .liquid-glass {
      background: rgba(255, 255, 255, 0.88) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      box-shadow: 0 4px 20px -2px rgba(1, 8, 40, 0.06), inset 0 1px 1px rgba(255, 255, 255, 1) !important;
      border: 1px solid rgba(1, 8, 40, 0.09) !important;
      color: #010828 !important;
    }

    .theme-light .liquid-glass::before {
      background: linear-gradient(180deg,
        rgba(1, 8, 40, 0.08) 0%, rgba(1, 8, 40, 0.02) 25%,
        transparent 50%, rgba(1, 8, 40, 0.02) 75%,
        rgba(1, 8, 40, 0.06) 100%) !important;
    }

    /* 5. Inner Wells, Inputs, Code Blocks, and Inactive Fields */
    .theme-light input,
    .theme-light textarea,
    .theme-light select,
    .theme-light [class*="bg-black/"],
    .theme-light .rounded-xl:not(button):not(.bg-neon):not([class*="bg-purpleRoyal"]):not([class*="bg-blueTech"]):not([class*="bg-amberAccent"]) {
      background-color: #F8F9FA !important;
      border-color: rgba(1, 8, 40, 0.12) !important;
      color: #010828 !important;
    }
    .theme-light input::placeholder,
    .theme-light textarea::placeholder {
      color: rgba(1, 8, 40, 0.45) !important;
    }

    /* 6. Secondary Pills, Chips, and Micro-affordances */
    .theme-light [class*="bg-white/5"],
    .theme-light [class*="bg-white/10"],
    .theme-light [class*="bg-white/15"],
    .theme-light [class*="bg-white/20"] {
      background-color: rgba(1, 8, 40, 0.05) !important;
      border-color: rgba(1, 8, 40, 0.10) !important;
      color: #010828 !important;
    }

    /* 7. Typography Contrasts */
    .theme-light h1:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light h2:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light h3:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light h4:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light h5:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light h6:not(#hero *):not(#contact *):not(#how-it-works *) {
      color: #010828 !important;
    }

    .theme-light p:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light label:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light span.text-cream:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light a.text-cream:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light div.text-cream:not(#hero *):not(#contact *):not(#how-it-works *) {
      color: #010828 !important;
    }

    .theme-light [class*="text-cream/90"]:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light [class*="text-cream/80"]:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light [class*="text-cream/70"]:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light [class*="text-white/80"]:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light [class*="text-white/70"]:not(#hero *):not(#contact *):not(#how-it-works *) {
      color: rgba(1, 8, 40, 0.78) !important;
    }

    .theme-light [class*="text-cream/60"]:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light [class*="text-cream/50"]:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light [class*="text-cream/40"]:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light [class*="text-cream/30"]:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light [class*="text-white/60"]:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light [class*="text-white/50"]:not(#hero *):not(#contact *):not(#how-it-works *) {
      color: rgba(1, 8, 40, 0.58) !important;
    }

    /* 8. Accent Script & Neon Accents */
    .theme-light .font-condiment.text-neon:not(#hero *):not(#contact *):not(#how-it-works *),
    .theme-light span.text-neon:not(#hero *):not(#contact *):not(#how-it-works *):not(button *):not(.bg-neon *) {
      color: #0D5C22 !important;
      mix-blend-mode: normal !important;
    }

    /* Neon CTA button stays ultra high-contrast punchy lime */
    .theme-light .bg-neon {
      background-color: #6FFF00 !important;
      color: #010828 !important;
      border-color: #0D5C22 !important;
      box-shadow: 0 4px 14px rgba(109, 255, 0, 0.3) !important;
    }

    /* 9. Hairline Borders */
    .theme-light [class*="border-white"]:not(#hero *):not(#contact *):not(#how-it-works *) {
      border-color: rgba(1, 8, 40, 0.09) !important;
    }

    /* 10. Environmental Blueprint & Grid Backgrounds */
    .theme-light .env-blueprint {
      background-image: 
        linear-gradient(to right, rgba(1, 8, 40, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(1, 8, 40, 0.04) 1px, transparent 1px) !important;
      background-size: 32px 32px;
    }

    .theme-light .env-scanlines {
      background-image: repeating-linear-gradient(
        0deg,
        rgba(2, 132, 199, 0.02) 0px,
        rgba(2, 132, 199, 0.02) 1px,
        transparent 1px,
        transparent 3px
      ) !important;
    }

    .theme-light .env-grid-subtle {
      background-image: radial-gradient(circle, rgba(1, 8, 40, 0.06) 1px, transparent 1px) !important;
    }

    /* 11. Footer */
    .theme-light footer {
      background-color: #F6F5F0 !important;
      border-color: rgba(1, 8, 40, 0.10) !important;
      color: rgba(1, 8, 40, 0.7) !important;
    }
    .theme-light footer a {
      color: rgba(1, 8, 40, 0.7) !important;
    }
    .theme-light footer a:hover {
      color: #010828 !important;
    }

    /* 12. Video Sections (#hero, #how-it-works, #contact) Maintain Deep Cinematic Contrast */
    .theme-light #hero,
    .theme-light #contact,
    .theme-light #how-it-works {
      color: #EFF4FF !important;
    }
    .theme-light #hero h1,
    .theme-light #hero h2,
    .theme-light #hero p,
    .theme-light #hero a:not(.bg-neon),
    .theme-light #hero span:not(.bg-neon),
    .theme-light #contact h1,
    .theme-light #contact h2,
    .theme-light #contact p,
    .theme-light #contact a:not(.bg-neon),
    .theme-light #contact span:not(.bg-neon),
    .theme-light #how-it-works h2,
    .theme-light #how-it-works p,
    .theme-light #how-it-works span:not(.bg-neon) {
      color: #EFF4FF !important;
    }
    .theme-light #hero .text-cream,
    .theme-light #contact .text-cream,
    .theme-light #how-it-works .text-cream {
      color: #EFF4FF !important;
    }
    .theme-light #hero .text-cream\/80,
    .theme-light #contact .text-cream\/80,
    .theme-light #how-it-works .text-cream\/80 {
      color: rgba(239, 244, 255, 0.8) !important;
    }
    .theme-light #hero .font-condiment.text-neon,
    .theme-light #contact .font-condiment.text-neon,
    .theme-light #how-it-works .font-condiment.text-neon {
      color: #6FFF00 !important;
      mix-blend-mode: exclusion !important;
    }
    .theme-light #hero .liquid-glass,
    .theme-light #how-it-works .liquid-glass {
      background: rgba(255, 255, 255, 0.05) !important;
      color: #EFF4FF !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // ICONS
    // ==========================================
    const Icons = {
      Github: ({ className = "w-4 h-4" }) => (
        <svg viewBox="0 0 24 24" className={className} stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>

      ),

          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>

      ),
      Sliders: ({ className = "w-4 h-4" }) => (
        <svg viewBox="0 0 24 24" className={className} stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">

      ),
      Activity: ({ className = "w-4 h-4" }) => (
        <svg viewBox="0 0 24 24" className={className} stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      ),
      Check: ({ className = "w-4 h-4" }) => (
        <svg viewBox="0 0 24 24" className={className} stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      ),
      ArrowRight: ({ className = "w-4 h-4" }) => (
        <svg viewBox="0 0 24 24" className={className} stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      ),
      Layers: ({ className = "w-4 h-4" }) => (
        <svg viewBox="0 0 24 24" className={className} stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
        </svg>
      ),
      Box: ({ className = "w-4 h-4" }) => (
        <svg viewBox="0 0 24 24" className={className} stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" x2="12" y1="22.08" y2="12"/>

      ),
      Sun: ({ className = "w-4 h-4" }) => (
        <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>

      ),
      Moon: ({ className = "w-4 h-4" }) => (
        <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      ),
      FileText: ({ className = "w-4 h-4" }) => (
        <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/>

          const path = window.location.pathname.replace('/design-preview/', '').replace('/design-preview', '');

        return localStorage.getItem('myfolio-theme') || 'dark';

        if (theme === 'light') {
