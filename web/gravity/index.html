<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#010828',
            cream: '#EFF4FF',
            neon: '#6FFF00',

          fontFamily: {

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #010828;
      --cream: #EFF4FF;
      --neon: #6FFF00;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #010828;
      color: #EFF4FF;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Liquid Glass Effect */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Root React Container -->
  <div id="root"></div>

  <!-- React TSX / JSX Implementation -->
  <script type="text/babel">
    const { useEffect, useState, useRef } = React;

    // SVG Icons
    function MailIcon({ className = "w-5 h-5" }) {
      return (
        <svg viewBox="0 0 24 24" className={className} stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      );
    }

    function TwitterIcon({ className = "w-5 h-5" }) {
      return (
        <svg viewBox="0 0 24 24" className={className} stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/>
        </svg>
      );
    }

    function GithubIcon({ className = "w-5 h-5" }) {
      return (
        <svg viewBox="0 0 24 24" className={className} stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
          <path d="M9 18c-4.51 2-5-2-7-2"/>
        </svg>
      );
    }

    function ArrowRightIcon({ className = "w-5 h-5" }) {
      return (
        <svg viewBox="0 0 24 24" className={className} stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      );
    }

    function MyFolioApp() {
      // Ensure all background videos autoplay smoothly
      useEffect(() => {
        const playAllVideos = () => {
          const videos = document.querySelectorAll('video');
          videos.forEach(v => {
            v.muted = true;
            v.defaultMuted = true;
            v.playsInline = true;
            const playPromise = v.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {});
            }
          });
        };

        playAllVideos();
        window.addEventListener('click', playAllVideos, { once: true });
        window.addEventListener('touchstart', playAllVideos, { once: true });

      const navLinks = [
        { label: 'UNIVERSES', href: '/universes.html' },
        { label: 'HOW IT WORKS', href: '#how-it-works' },
        { label: 'STUDIO', href: '/studio' },
        { label: 'EXAMPLES', href: '#collection' },
        { label: 'ABOUT', href: '/about.html' },
      ];

      const universes = [
        {
          video: "/assets/videos/orbis-card1.mp4",
          fallbackVideo: "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260331_053923_22c0a6a5-313c-474c-85ff-3b50d25e944a.mp4",
          title: "CYBER ARCHITECT SPRAWL",
          archetype: "SYSTEMS & DEVOPS",
          link: "/studio?universe=cyber-architect-sprawl"
        },
        {
          video: "/assets/videos/orbis-card2.mp4",
          fallbackVideo: "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260331_054411_511c1b7a-fb2f-42ef-bf6c-32c0b1a06e79.mp4",
          title: "CHRONO OBSIDIAN SANCTUARY",
          archetype: "AI RESEARCH & QUANT",
          link: "/studio?universe=chrono-obsidian-sanctuary"
        },
        {
          video: "/assets/videos/orbis-card3.mp4",
          fallbackVideo: "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260331_055427_ac7035b5-9f3b-4289-86fc-941b2432317d.mp4",
          title: "CIRCUIT CORE HARDWARE",
          archetype: "ROBOTICS & EMBEDDED",
          link: "/studio?universe=circuit-core"

      return (
        <div className="relative w-full bg-[#010828] text-cream min-h-screen">

              backgroundSize: 'cover',

              mixBlendMode: 'lighten'

          {/* ========================================================================= */}
          {/* SECTION 1: HERO (Full viewport, rounded-b-[40px] bottom corners clipping video) */}

              muted
              playsInline
              preload="auto"
              className="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none"
            >
              <source src="/assets/videos/orbis-hero.mp4" type="video/mp4" />
              <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260331_045634_e1c98c76-1265-4f5c-882a-4276f2080894.mp4" type="video/mp4" />

            {/* Hero Main Content */}
            <div className="relative z-10 w-full max-w-[1831px] mx-auto px-6 sm:px-10 lg:px-16 flex-1 flex flex-col justify-start pt-10 sm:pt-14 lg:pt-20">

                {/* 3-line Heading matching exact reference typography */}
                <h1 className="font-grotesk uppercase text-cream text-[40px] sm:text-[60px] md:text-[75px] lg:text-[90px] leading-[1.02] tracking-tight">
                  YOUR RESUME<br />
                  RENDERED AS ( A )<br />

                {/* Overlaid Cursive Accent Text: Condiment font, neon green, mix-blend-exclusion, opacity-90 */}
                <span 
                  className="absolute top-[34%] sm:top-[33%] md:top-[32%] right-[-10px] sm:right-[-40px] md:right-[-90px] lg:right-[-120px] font-condiment text-neon text-[28px] sm:text-[38px] md:text-[48px] lg:text-[54px] -rotate-2 mix-blend-exclusion opacity-90 select-none pointer-events-none capitalize whitespace-nowrap"

              {/* Social Icons (Mobile): Centered horizontally below heading */}

                <a href="https://twitter.com" target="_blank" rel="noopener" aria-label="Twitter" className="liquid-glass rounded-[1rem] w-[56px] h-[56px] flex items-center justify-center text-cream hover:text-neon hover:bg-white/10 transition-colors duration-200">
                  <TwitterIcon className="w-[20px] h-[20px]" />
                </a>
                <a href="/contact.html" aria-label="Contact" className="liquid-glass rounded-[1rem] w-[56px] h-[56px] flex items-center justify-center text-cream hover:text-neon hover:bg-white/10 transition-colors duration-200">
                  <MailIcon className="w-[20px] h-[20px]" />
                </a>
              </div>
            </div>

            {/* Bottom spacer for padding balance */}
            <div className="h-16"></div>
          </section>

          {/* ========================================================================= */}
          {/* SECTION 2: ABOUT / PHILOSOPHY (Full viewport, looping background video) */}

          <section id="how-it-works" className="relative w-full min-h-screen overflow-hidden flex flex-col justify-between py-16 md:py-24">
            {/* Background looping muted video positioned at z-0 */}

              loop
              muted
              playsInline
              preload="auto"
              className="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none"
            >
              <source src="/assets/videos/orbis-about.mp4" type="video/mp4" />
              <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260331_151551_992053d1-3d3e-4b8c-abac-45f22158f411.mp4" type="video/mp4" />
            </video>

            <div className="relative z-10 w-full max-w-[1831px] mx-auto px-6 sm:px-10 lg:px-16 flex-1 flex flex-col justify-between">
              {/* Top Row: Flex row on desktop, column on mobile */}
              <div className="flex flex-col md:flex-row md:items-start justify-between gap-8 pt-6">
                {/* Left: Heading in Anton 32px-60px uppercase with overlaid cursive */}

                    GREAT WORK<br />

                  <p>CHOOSE FROM DISTINCT TAILORED UNIVERSES RATHER THAN ONE FIXED FLAT TEMPLATE</p>
                </div>

                <div>
                  <h2 className="font-grotesk text-[32px] sm:text-[46px] lg:text-[60px] uppercase text-cream leading-tight">
                    COLLECTION OF

                  <div className="ml-12 sm:ml-24 lg:ml-32 flex items-baseline gap-3">
                    <span className="font-condiment text-neon text-[38px] sm:text-[54px] lg:text-[70px] -rotate-2 capitalize select-none">
