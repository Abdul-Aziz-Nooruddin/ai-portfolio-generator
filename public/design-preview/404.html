<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — MyFolio Design Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f4f1e8;--ink:#171817;--sky:#75c5de;--muted:#60615b;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--ink);color:var(--paper);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
    .preview-bar{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08);}
    .preview-bar a{color:#75c5de;text-decoration:none;}
    .top-nav{border-bottom:1px solid rgba(255,255,255,0.08);padding:0 max(24px,calc((100vw - 1200px)/2));height:56px;display:flex;align-items:center;justify-content:space-between;}
    .nav-brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:-0.04em;text-decoration:none;color:var(--paper);}
    .brand-dot{width:7px;height:7px;border-radius:50%;background:var(--sky);}
    .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;position:relative;overflow:hidden;}
    .bg-404{position:absolute;font-size:clamp(200px,30vw,400px);font-weight:700;letter-spacing:-0.08em;color:rgba(255,255,255,0.03);line-height:1;user-select:none;pointer-events:none;z-index:0;}
    .content{position:relative;z-index:1;max-width:500px;}
    .eyebrow{font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--sky);margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:8px;}
    .eyebrow::before,.eyebrow::after{content:'';width:20px;height:1px;background:rgba(117,197,222,0.4);}
    h1{font-size:clamp(36px,5vw,64px);font-weight:500;letter-spacing:-0.06em;line-height:1.05;margin-bottom:20px;}
    .sub{font-size:16px;color:rgba(244,241,232,0.55);line-height:1.65;margin-bottom:40px;}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    .btn-main{padding:14px 24px;background:var(--paper);color:var(--ink);border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;transition:opacity 0.15s;letter-spacing:-0.02em;}
    .btn-main:hover{opacity:0.86;}
    .btn-ghost{padding:14px 24px;border:1.5px solid rgba(255,255,255,0.15);background:none;color:var(--paper);border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;transition:border-color 0.2s,background 0.2s;}
    .btn-ghost:hover{border-color:rgba(255,255,255,0.35);background:rgba(255,255,255,0.06);}
    .divider{width:1px;height:40px;background:rgba(255,255,255,0.1);}
    .helpful-links{margin-top:64px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
    .helpful-link{padding:8px 16px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;font-size:12px;font-weight:500;color:rgba(244,241,232,0.5);text-decoration:none;transition:border-color 0.2s,color 0.2s;}
    .helpful-link:hover{border-color:rgba(117,197,222,0.3);color:var(--sky);}
    .footer{border-top:1px solid rgba(255,255,255,0.07);padding:24px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;}
    .footer-text{font-size:12px;color:rgba(244,241,232,0.25);}
  </style>
</head>
<body>
  <div class="preview-bar"><span>&#128065; Design Preview — 404 Page</span><a href="/design-preview">&#8592; Hub</a></div>
  <nav class="top-nav">
    <a class="nav-brand" href="/"><span class="brand-dot"></span> MyFolio</a>
    <a href="/studio" style="padding:8px 16px;border:1px solid rgba(255,255,255,0.15);color:var(--paper);border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;">Open Studio</a>
  </nav>
  <main class="main">
    <div class="bg-404">404</div>
    <div class="content">
      <div class="eyebrow">Not Found</div>
      <h1>This page doesn&#8217;t exist.</h1>
      <p class="sub">The URL you followed either moved, expired, or was never here to begin with. It happens.</p>
      <div class="actions">
        <a class="btn-main" href="/">&#8592; Back home</a>
        <div class="divider"></div>
        <a class="btn-ghost" href="/studio">Open Studio ↗</a>
      </div>
      <div class="helpful-links">
        <a class="helpful-link" href="/dashboard">Dashboard</a>
        <a class="helpful-link" href="/auth">Sign In</a>
        <a class="helpful-link" href="/about">About</a>
        <a class="helpful-link" href="/contact">Contact</a>
        <a class="helpful-link" href="/privacy">Privacy</a>
      </div>
    </div>
  </main>
  <footer class="footer">
    <span class="footer-text">myfolio.tech &#169; 2026</span>
    <span class="footer-text">404 &#8212; page not found</span>
  </footer>
</body>
</html>
